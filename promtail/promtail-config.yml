server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: windows_events
    pipeline_stages:
      - json:
          expressions:
            message: message
            level: level
            timestamp: timestamp
    static_configs:
      - targets:
          - localhost
        labels:
          job: windows_events
          __path__: /var/log/windows_events.log

  - job_name: varlogs
    static_configs:
      - targets:
          - localhost
        labels:
          job: varlogs
          __path__: /var/log/*log